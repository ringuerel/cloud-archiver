name: Build and Push Release Candidate Docker Image

on:
  push:
    branches:
      - 'release/*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Extract project version
        id: get_version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        id: get_timestamp
        run: echo "TIMESTAMP=$(date +%s%3N)" >> $GITHUB_OUTPUT

      - name: Rename JAR for Docker
        run: mv target/cloud-archiver-${{ steps.get_version.outputs.VERSION }}.jar target/app.jar

      - name: Copy JAR to Docker build context
        run: cp target/app.jar src/main/docker/app.jar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: src/main/docker
          file: src/main/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloud-archiver:${{ steps.get_version.outputs.VERSION }}-RC-${{ steps.get_timestamp.outputs.TIMESTAMP }}
